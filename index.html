<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>StatZone01 | Sign in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-container">
    <div class="login-card">
      <h1 class="brand brand-large">
        <span class="brand-stat">Stat</span><img class="brand-logo" src="assets/zone01-logo.svg" alt="Zone01">
      </h1>
      <p class="login-subtitle">See your Zone01 stats. Sign in with your platform credentials.</p>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="identifier">Username or email</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="error-message" class="error-message" role="alert" hidden></p>

        <button type="submit" class="login-button">Sign in</button>
      </form>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
