<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#161718">
  <title>StatZone01 | Sign in</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161718'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' text-anchor='middle' fill='%23fcff6b'%3E01%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <noscript>
    <p class="noscript">StatZone01 needs JavaScript to sign you in. Please enable it and reload the page.</p>
  </noscript>
  <main class="login-container">
    <div class="login-card">
      <h1 class="brand brand-large">
        <span class="brand-stat">Stat</span><img class="brand-logo" src="assets/zone01-logo.svg" alt="Zone01">
      </h1>
      <p class="login-subtitle">See your Zone01 stats. Sign in with your platform credentials.</p>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="identifier">Username or email</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="error-message" class="error-message" role="alert" hidden></p>

        <button type="submit" class="login-button">Sign in</button>
      </form>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
