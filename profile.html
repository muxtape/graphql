<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#161718">
  <title>StatZone01 | Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" hidden>
    <header class="navbar">
      <div class="navbar-inner">
        <a class="brand" href="profile.html" aria-label="StatZone01, home">
          <span class="brand-stat">Stat</span><img class="brand-logo" src="assets/zone01-logo.svg" alt="Zone01">
        </a>
        <button type="button" id="logout-button" class="logout-button">Log out</button>
      </div>
    </header>

    <main class="page">
      <p id="status-message" class="status-message" role="status">Loading your data...</p>

      <div id="dashboard" hidden>
        <h1 id="welcome" class="welcome"></h1>

        <div class="grid grid-summary">
          <section id="identity" class="card" aria-labelledby="identity-title">
            <h2 id="identity-title" class="card-title">Identity</h2>
            <dl class="info-list">
              <div class="info-row"><dt>Login</dt><dd id="user-login"></dd></div>
              <div class="info-row"><dt>Campus</dt><dd id="user-campus"></dd></div>
              <div class="info-row"><dt>Started</dt><dd id="user-started"></dd></div>
            </dl>
          </section>

          <section id="progress" class="card" aria-labelledby="progress-title">
            <h2 id="progress-title" class="card-title">Progress</h2>
            <dl class="stat-stack">
              <div class="stat"><dt>Level</dt><dd id="stat-level"></dd></div>
              <div class="stat"><dt>Total XP</dt><dd id="stat-xp"></dd></div>
            </dl>
          </section>

          <section id="audits" class="card" aria-labelledby="audits-title">
            <h2 id="audits-title" class="card-title">Audits</h2>
            <dl class="stat-stack">
              <div class="stat"><dt>Audit ratio</dt><dd id="stat-audit"></dd></div>
            </dl>
            <div id="audit-chart" class="card-chart"></div>
          </section>

          <section id="skills" class="card" aria-labelledby="skills-title">
            <h2 id="skills-title" class="card-title">Top skills</h2>
            <div id="skills-chart"></div>
          </section>
        </div>

        <div class="grid grid-charts">
          <section class="card" aria-labelledby="xp-line-heading">
            <div class="card-head">
              <h2 id="xp-line-heading" class="card-title">XP over time</h2>
              <button type="button" id="xp-replay" class="chart-replay" aria-label="Replay the XP chart animation">Replay</button>
            </div>
            <div id="xp-line-chart"></div>
          </section>

          <section class="card" aria-labelledby="xp-month-heading">
            <div class="card-head">
              <h2 id="xp-month-heading" class="card-title">XP per month</h2>
            </div>
            <div class="chart-toolbar">
              <div class="view-keys" role="group" aria-label="Choose which XP to show">
                <button type="button" class="view-key" data-view="all" aria-pressed="true">All</button>
                <button type="button" class="view-key" data-view="projects" aria-pressed="false">Projects</button>
                <button type="button" class="view-key" data-view="piscines" aria-pressed="false">Piscines</button>
              </div>
              <div class="chart-legend" aria-hidden="true">
                <span><i class="legend-swatch legend-projects"></i>Projects and exercises</span>
                <span><i class="legend-swatch legend-piscines"></i>Piscines</span>
              </div>
            </div>
            <div id="monthly-chart"></div>
            <p id="monthly-note" class="stat-note"></p>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
