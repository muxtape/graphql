<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | GraphQL Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" hidden>
    <header class="profile-header">
      <h1 class="profile-title">Profile</h1>
      <button type="button" id="logout-button" class="logout-button">Log out</button>
    </header>

    <main class="profile-content">
      <p id="status-message" class="status-message" role="status">Loading your data...</p>

      <section id="identity" class="card" hidden>
        <h2 class="card-title">Welcome, <span id="user-login"></span></h2>
        <p>User ID: <span id="user-id"></span></p>
      </section>
    </main>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
