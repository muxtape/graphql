<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | GraphQL Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" hidden>
    <header class="profile-header">
      <h1 class="profile-title">Profile</h1>
      <button type="button" id="logout-button" class="logout-button">Log out</button>
    </header>

    <main class="profile-content">
      <p id="status-message" class="status-message" role="status">Loading your data...</p>

      <div id="dashboard" hidden>
        <h2 id="welcome" class="welcome"></h2>

        <section id="identity" class="card" aria-labelledby="identity-title">
          <h3 id="identity-title" class="card-title">Identity</h3>
          <dl class="info-list">
            <div class="info-row"><dt>Login</dt><dd id="user-login"></dd></div>
            <div class="info-row"><dt>Campus</dt><dd id="user-campus"></dd></div>
            <div class="info-row"><dt>Started</dt><dd id="user-started"></dd></div>
          </dl>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
