<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | GraphQL Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" hidden>
    <header class="profile-header">
      <h1 class="profile-title">Profile</h1>
      <button type="button" id="logout-button" class="logout-button">Log out</button>
    </header>

    <main class="profile-content">
      <p id="status-message" class="status-message" role="status">Loading your data...</p>

      <div id="dashboard" hidden>
        <h2 id="welcome" class="welcome"></h2>

        <section id="stats" class="card" aria-labelledby="stats-title">
          <h3 id="stats-title" class="card-title">Progress</h3>
          <dl class="stat-grid">
            <div class="stat"><dt>Level</dt><dd id="stat-level"></dd></div>
            <div class="stat"><dt>Total XP</dt><dd id="stat-xp"></dd></div>
            <div class="stat"><dt>Audit ratio</dt><dd id="stat-audit"></dd></div>
          </dl>
          <p class="stat-note">
            Audits done <span id="audit-up"></span> · received <span id="audit-down"></span>
          </p>
        </section>

        <section id="identity" class="card" aria-labelledby="identity-title">
          <h3 id="identity-title" class="card-title">Identity</h3>
          <dl class="info-list">
            <div class="info-row"><dt>Login</dt><dd id="user-login"></dd></div>
            <div class="info-row"><dt>Campus</dt><dd id="user-campus"></dd></div>
            <div class="info-row"><dt>Started</dt><dd id="user-started"></dd></div>
          </dl>
        </section>

        <section id="skills" class="card" aria-labelledby="skills-title">
          <h3 id="skills-title" class="card-title">Top skills</h3>
          <ol id="skills-list" class="skill-list"></ol>
          <p id="skills-empty" class="stat-note" hidden>No skills yet.</p>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
